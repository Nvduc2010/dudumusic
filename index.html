<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#121212">
    <title>DuDu Music - Nghe nhạc</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <header class="header">
            <div class="logo">♫ <span>DuDu Music</span></div>
            <p>DuDu Music ♫</p>
        </header>

        <section class="player">
            <div class="cover-container">
                <img
                    id="cover"
                    src="images/1.jpg"
                    alt="Ảnh bìa bài hát"
                >
            </div>

            <div class="song-info">
                <h1 id="title">Chưa chọn bài hát</h1>
                <p id="artist">Hãy chọn một bài để nghe</p>
            </div>

            <audio id="audio" preload="metadata"></audio>

            <div class="progress-area">
                <input
                    type="range"
                    id="progress"
                    min="0"
                    max="100"
                    value="0"
                    step="0.1"
                    aria-label="Tiến trình bài hát"
                >
                <div class="time">
                    <span id="current-time">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="controls">
                <button id="prev" aria-label="Bài trước" title="Bài trước">⏮</button>
                <button id="play" class="play-button"
                    aria-label="Phát nhạc" title="Phát nhạc">▶</button>
                <button id="next" aria-label="Bài tiếp theo" title="Bài tiếp theo">⏭</button>
            </div>

            <div class="volume-area">
                <span aria-hidden="true">🔊</span>
                <input
                    type="range"
                    id="volume"
                    min="0"
                    max="1"
                    step="0.01"
                    value="0.8"
                    aria-label="Âm lượng"
                >
            </div>
        </section>

        <section class="playlist">
            <h2>Danh sách bài hát</h2>
            <div id="song-list"></div>
        </section>

        <footer>© 2026 DuDu Music</footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
